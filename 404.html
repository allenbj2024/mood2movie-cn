<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mood2movie 中文版</title>
    <script>
      (function () {
        var marker = "/movies/";
        var path = window.location.pathname;
        var base = path;
        var hash = "";

        if (path.indexOf(marker) >= 0) {
          base = path.slice(0, path.indexOf(marker)) + "/";
          hash = "#/movies/" + path.slice(path.indexOf(marker) + marker.length).split("/")[0];
        } else {
          base = path.replace(/[^/]*$/, "");
        }

        window.location.replace(base + hash + window.location.search);
      })();
    </script>
  </head>
  <body>
    <p>正在打开 mood2movie 中文版...</p>
  </body>
</html>
